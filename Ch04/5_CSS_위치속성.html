    <title>5_CSS_위치속성</title>
    <style>
        section {
            display: inline-block;
            width: 200px;
            height: 400px;
            border: 1px solid black;
            box-sizing: border-box;
        }

        section > div {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            box-sizing: border-box;
        }
        section >  div:nth-of-type(1) { background-color: red; }
        section >  div:nth-of-type(2) { background-color: green; }
        section >  div:nth-of-type(3) { background-color: blue }
