<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Layout #2</title>
    <style>
        /* 초기화 */
        * {
            margin: 0;
            padding: 0;
            font: normal 12px '돋움';
        }

        #container {
            width: 800px;
            height: auto;
            padding: 10px;
            border: 1px solid black;
            box-sizing: border-box;
            margin: 0 auto;
        }

        header {
            width: 100%;
            height: 120px;
            background: #eee;
            border: 1px dashed black;
            box-sizing: border-box;
        }
        main {
            width: auto;
            height: auto;
            margin: 10px 0;
            padding: 10px;
            border: 1px dashed black;
            box-sizing: border-box;
        }

        main > section {
            width: 100%;
            height: 200px;
            border: 1px dashed black;
            margin: 10px 0;
            box-sizing: border-box;
            background: #ddd;
        }
        footer{
            width: 100%;
            height: 100px;
            margin: 10px 0;
            background: #eee;
            border: 1px dashed black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>header</header>
        <main>
            main
            <section>section</section>
            <section>section</section>
        </main>
        <footer>footer</footer>
    </div>
</body>
</html>
